<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎光臨22222</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at top left, #b3377f, transparent 35%),
        linear-gradient(135deg, #e8f8ed, #86657b);

      color: #d4118a;
    }

    .card {
      width: 90%;
      max-width: 650px;

      padding: 60px 40px;
      text-align: center;

      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #7acb95;
      border-radius: 24px;

      box-shadow: 0 15px 40px rgba(30, 100, 60, 0.18);

      animation: fadeIn 1s ease;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      color: #23864b;
    }

    p {
      margin-top: 18px;
      font-size: 20px;
      color: #477a5a;
      line-height: 1.8;
    }

    button {
      margin-top: 25px;

      padding: 14px 32px;

      border: none;
      border-radius: 30px;

      font-size: 18px;
      font-weight: bold;

      color: white;
      background: #2da65a;

      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      background: #19783c;
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(20, 100, 50, 0.25);
    }

    #message {
      margin-top: 25px;
      min-height: 30px;

      font-size: 18px;
      font-weight: bold;

      color: #23864b;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 45px 25px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🌿</div>

    <h1>歡迎光臨11111</h1>

    <p>
      很高興您的到來！<br>
      歡迎進入我們的綠色小天地。
    </p>

    <button onclick="sayHello()">
      點我打招呼
    </button>

    <div id="message"></div>

  </div>

  <script>
    function sayHello() {
      document.getElementById("message").innerHTML =
        "👋 您好！祝您今天有個愉快的一天！";
    }
  </script>

</body>
</html>
