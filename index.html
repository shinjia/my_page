<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎光臨｜Webcam 拍照</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="icon">🌿</div>
    <h1>歡迎光臨2222222</h1>
    <p class="intro">
      歡迎來到綠色影像小站<br>
      開啟 Webcam 後即可倒數拍照並存檔。
    </p>

    <section class="camera-box">
      <div class="video-wrap">
        <video id="video" autoplay playsinline></video>
        <div id="countdown" class="countdown"></div>
      </div>

      <canvas id="canvas"></canvas>

      <div class="buttons">
        <button id="startCameraBtn">開啟 Webcam</button>
        <button id="captureBtn" disabled>📷 倒數拍照</button>
      </div>

      <div id="message" class="message">尚未開啟 Webcam</div>

      <div id="previewArea" class="preview-area hidden">
        <h2>拍照結果</h2>
        <img id="photoPreview" alt="拍照預覽">
        <a id="downloadLink" class="download-link">下載照片</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
